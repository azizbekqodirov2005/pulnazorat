# Render Blueprint — backend'ni bir marta "New Blueprint" orqali joylashtirish uchun.
# Render dashboard'da: New -> Blueprint -> shu repo -> Apply.
# DATABASE_URL'ni Neon'dan olib qo'lda kiritasiz (sync: false — maxfiy qiymat repo'da saqlanmaydi).
services:
  - type: web
    name: pulnazorat-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      # Parolni tiklash kodini emailga yuborish uchun (ixtiyoriy, ikkitadan biri kifoya).
      # Sozlanmasa, "parolni unutdim" funksiyasi xato qaytaradi, lekin qolgan hamma narsa ishlayveradi.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
